name: Testes e Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          pip install pytest flake8 coverage

      - name: Rodar flake8 (linting)
        run: |
          flake8 main.py inventario

      - name: Rodar testes com unittest
        run: |
          python -m unittest tests/testes.py tests/test_vulnerabilidades.py tests/test_persistencia.py tests/test_repositorio.py tests/test_repositorio_sqlite.py

      - name: Rodar testes com pytest
        run: |
          pytest tests/test_exemplos.py -v