name: Testes e Linting

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  testes:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Instalar dependências
        run: |
          python3 -m pip install -r requirements.txt pytest flake8 coverage

      - name: Rodar flake8 (linting)
        run: |
          python3 -m flake8 main.py iniciar_api.py inventario

      - name: Rodar testes com unittest
        run: |
          python3 -m unittest discover -s tests

      - name: Rodar testes com pytest
        run: |
          python3 -m pytest tests/test_exemplos.py -v