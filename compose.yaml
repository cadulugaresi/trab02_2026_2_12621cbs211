services:
  inventario:
    build: .
    container_name: inventario
    stdin_open: true
    tty: true
    restart: unless-stopped
    volumes:
      - "dados:/app/dados"
    healthcheck:
      test: ["CMD", "python3", "-c", "import sqlite3; sqlite3.connect('inventario.db').execute('SELECT 1')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados: