name: trab02_2026_2_12621cbs211

services:
  inventario:
    build: .
    image: trab02_2026_2_12621cbs211
    container_name: trab02_2026_2_12621cbs211
    restart: unless-stopped
    ports:
      - "2211:5000"
    volumes:
      - "dados:/app/dados"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/saude')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados: