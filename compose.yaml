services:
  inventario:
    build: .
    container_name: inventario
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - "dados:/app/dados"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/saude')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  dados: